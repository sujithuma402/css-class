<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport"content="width=device-width,initial-scale=1.0">
        <title>Grid Practice</title>
    </head>
    <body>
        <div id="grid-container">
            <div class="item">lotus</div>
            <div class="item">jasmine</div>
            <div class="item">lily</div>
            <div class="item">sunflower</div>
            <div class="item">marigold</div>
            <div class="ite">rose</div>
            </div>
    </body>
    <style>
        *{
margin: 0;
padding: 0;
box-sizing: border-box;

}
/*container setup*/
#grid-container{
    display: grid;
    height: 400px;
    border:2px solid black;
    grid-template-columns: 1fe 1fr 1fr;
    grid-template-rows: 1fr 1fr 1fr;
    gap: 10px;
    justify-items: center;
}
/*item spanning(columns>*/
.item:nth-child(1){
    grid-column: 1/3;
}
/*item spanning(rows)*/
.item:nth-child(2){
    grid-row: 1/3;
}
/*naming columns*/
#grid-container.named{
    grid-template-columns: [start] 1fr [mid] 1fr [end] 1fr;
}
.item.item:nth-child(1).named{
    grid-column:start/mid;
}
/* Area Definition*/
#grid-container.areas{
    grid-template-columns: 1fr 1fr;
    grid-template-rows: 1fr 1fr;
    grid-template-areas:
    "a b"
    "c d";
}
.item:nth-child(3).areas{
    grid-area:c;
}
    </style>
    </html>
